server.port=8085
spring.application.name=voice-insights-policy-mcp

# ── MCP server (Streamable HTTP at /mcp) ────────────────────────────────────
spring.ai.mcp.server.name=policy-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# ── Policy system API the tool calls ────────────────────────────────────────
# Default points at the dummy API served by THIS app. To go live, change only the URL
# (and set policy.api.dummy.enabled=false); the tool and its callers do not change.
policy.api.base-url=${POLICY_API_BASE_URL:http://localhost:8085/dummy-api}
policy.api.timeout-ms=${POLICY_API_TIMEOUT_MS:3000}
policy.api.dummy.enabled=${POLICY_API_DUMMY_ENABLED:true}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jackson.serialization.write-dates-as-timestamps=false
